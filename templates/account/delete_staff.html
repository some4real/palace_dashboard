{% include 'shelter/base.html' %}
{% include 'shelter/dashboard_sidebar.html' %}
{% load static %}

<div class="ml-64 min-h-screen bg-gradient-to-br from-gray-50 via-white to-gray-100 flex items-center justify-center px-4">
  <div class="bg-white shadow-xl rounded-2xl p-8 max-w-md w-full text-center">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 mx-auto text-red-500 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5-4h4m-4 0a1 1 0 00-1 1v1h6V4a1 1 0 00-1-1m-4 0h4" />
    </svg>
    <h2 class="text-xl font-bold text-gray-800 mb-2">Delete Staff Account</h2>
    <p class="text-gray-600 mb-6">Are you absolutely sure you want to delete <strong>{{ user.email }}</strong>? This action cannot be undone.</p>

    <form method="post" class="space-y-3">
      {% csrf_token %}
      <button type="submit" class="w-full py-2 px-4 bg-red-600 hover:bg-red-700 text-white rounded-md font-semibold transition">
        Yes, Delete User
      </button>
      <a href="{% url 'staff_list' %}" class="w-full inline-block py-2 px-4 border border-gray-300 rounded-md hover:bg-gray-50 text-gray-700 transition">
        Cancel
      </a>
    </form>
  </div>
</div>
