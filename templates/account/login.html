{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Gida</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="{% static 'img/favicon.png' %}" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
  <div class="min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-lg shadow">
      <div class="text-center">
        <a href="{% url 'index' %}"><img src="https://res.cloudinary.com/dlhvy3thk/image/upload/e_background_removal/c_pad,w_160,h_160,f_png/v1746023150/Untitled_design_7_oejd5n.png" alt="Gida Logo" class="h-20 mx-auto mb-4">
        </a>
        <h2 class="text-2xl font-bold">Sign in to your account</h2>
        <p class="text-sm text-gray-500">Staff must use the invitation email.</p>
      </div>
      <form method="post" action="{% url 'login' %}" class="space-y-4">
        {% csrf_token %}
        {% if form.errors %}
          <div class="text-red-600 text-sm">{{ form.non_field_errors }}</div>
        {% endif %}
        <div>
          <label for="email" class="block text-sm font-medium">Email</label>
          <input type="email" name="username" id="email" class="mt-1 block w-full px-4 py-2 border rounded-md focus:ring focus:ring-indigo-200" required>
        </div>
        <div>
          <label for="password" class="block text-sm font-medium">Password</label>
          <input type="password" name="password" id="password" class="mt-1 block w-full px-4 py-2 border rounded-md focus:ring focus:ring-indigo-200" required>
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700">Sign In</button>
        <p class="text-center text-sm mt-4">
          <a href="{% url 'password_reset' %}" class="text-indigo-600 hover:underline">Forgot your password?</a>
        </p>
        <p class="text-center text-sm mt-4">Don't have an account? <a href="{% url 'reg_org' %}" class="text-indigo-600 hover:underline">Register</a></p>
      </form>
    </div>
  </div>
</body>
</html>
