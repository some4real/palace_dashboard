<!-- Organization Settings -->
{% include 'shelter/dashboard_sidebar.html' %}
{% load static %}

<div class="flex-1 ml-64 flex flex-col items-center justify-center h-screen bg-gray-50">
  <!-- Company Logo -->
  <div class="mb-6">
    <img src="{{ organization.logo.url }}" alt="Company Logo" class="h-20 w-auto mx-auto">
  </div>

  <!-- Organization Settings Form -->
  <div class="w-full max-w-4xl bg-white p-10 rounded-lg shadow-lg">
    <h3 class="text-2xl font-semibold mb-6 text-center text-gray-800">Organization Settings</h3>
    <form method="POST" enctype="multipart/form-data" action="{% url 'organization_setting' %}">
      {% csrf_token %}
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700">Organization Name</label>
          <input type="text" name="name" value="{{ organization.name }}" class="mt-1 w-full px-4 py-3 border rounded-lg focus:ring focus:ring-indigo-200" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Organization Code</label>
          <input type="text" name="code" value="{{ organization.code }}" class="mt-1 w-full px-4 py-3 border rounded-lg focus:ring focus:ring-indigo-200" />
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700">Logo</label>
          <input type="file" name="logo" class="mt-1 w-full px-4 py-3 border rounded-lg focus:ring focus:ring-indigo-200" />
        </div>
      </div>
      <div class="mt-8 text-center">
        <button type="submit" class="px-6 py-3 bg-primary text-white rounded-lg hover:bg-blue-700">Update Settings</button>
      </div>
    </form>
  </div>
</div>
