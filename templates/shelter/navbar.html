<!-- shelter/templates/shelter/navbar.html -->
{% include "shelter/base.html" %}

{% load static %}

<!-- NAVBAR -->
<div class="bg-white bg-opacity-90 shadow fixed top-4 left-6 right-6 z-50 rounded-2xl transition duration-300 ease-in-out hover:bg-opacity-100">
  <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <!-- Logo Section -->
      <div class="flex-shrink-0">
        <a href="{% url 'index' %}" class="navbar-brand">
          <img src="https://res.cloudinary.com/dlhvy3thk/image/upload/e_background_removal/c_pad,w_160,h_160,f_png/v1746023150/Untitled_design_7_oejd5n.png" 
               alt="GIDA Logo" 
               class="h-12 w-auto sm:h-16 md:h-20 mx-auto">
        </a>
      </div>
      <!-- Navigation Links -->
      <div class="hidden md:flex items-center space-x-6">
        <a href="#features" class="text-gray-600 hover:text-indigo-600 transition duration-300">Features</a>
        <a href="#pricing" class="text-gray-600 hover:text-indigo-600 transition duration-300">Pricing</a>
        <a href="#testimonials" class="text-gray-600 hover:text-indigo-600 transition duration-300">Testimonials</a>
        <a href="#about" class="text-gray-600 hover:text-indigo-600 transition duration-300">About</a>
        <a href="#faq" class="text-gray-600 hover:text-indigo-600 transition duration-300">FAQ</a>

        {% if request.user.is_authenticated %}
        <a href="{% url 'dashboard' %}" class="relative block w-10 h-10 rounded-full border-2 border-primary overflow-hidden shadow">
          <img src="{% if user.photo %}{{ user.photo.url }}{% else %}https://res.cloudinary.com/dlhvy3thk/image/upload/t_default/coodomqszlct7aqwxtcn.jpg{% endif %}" 
                alt="{{ user.name }}" class="w-full h-full object-cover" />
        </a>

        {% else %}
        <a href="{% url 'login' %}" class="text-indigo-600 font-medium hover:text-indigo-800 transition duration-300">Login</a>
        <a href="{% url 'reg_org' %}" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 transition duration-300">Register</a>
        {% endif %}

      </div>
      <!-- Mobile Menu Button -->
      <button id="menu-btn" class="md:hidden flex items-center text-gray-600 focus:outline-none">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
    </button>
</div>
</div>
<!-- Mobile Menu -->
<div id="mobile-menu" class="hidden md:hidden bg-white">
<a href="#features" class="block px-4 py-2 text-gray-600 hover:bg-gray-100">Features</a>
<a href="#pricing" class="block px-4 py-2 text-gray-600 hover:bg-gray-100">Pricing</a>
<a href="#testimonials" class="block px-4 py-2 text-gray-600 hover:bg-gray-100">Testimonials</a>
<a href="#about" class="block px-4 py-2 text-gray-600 hover:bg-gray-100">About</a>
<a href="#faq" class="block px-4 py-2 text-gray-600 hover:bg-gray-100">FAQ</a>
<a href="{% url 'login' %}" class="block px-4 py-2 text-indigo-600 font-medium hover:bg-gray-100">Login</a>
<a href="{% url 'reg_org' %}" class="block px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700">Register</a>
</div>
</nav>
